name: nuxtjs-prod
services:
  db:
    image: postgres:16
    container_name: mosec-db-prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: mosec
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mosec"]
      interval: 5s
      timeout: 5s
      retries: 10

  nuxt:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: mosec-nuxt-prod
    restart: unless-stopped
    ports:
      - "3000:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # <-- Diperbaiki: localhost diganti jadi 'db'
      - DATABASE_URL=postgresql://postgres:root@db:5432/mosec
      # PythonServer runs on the host, reach it via the Docker host gateway.
      - NUXT_PYTHON_SERVER_URL=http://host.docker.internal:8000
    depends_on:
      db:
        condition: service_healthy   # <-- Diperbaiki: db-prod diganti jadi db
    # Baris command npm DIHAPUS agar CMD dari Dockerfile.prod bisa bekerja

# <-- Diperbaiki: Wajib mendaftarkan nama volume di sini
volumes:
  pgdata: