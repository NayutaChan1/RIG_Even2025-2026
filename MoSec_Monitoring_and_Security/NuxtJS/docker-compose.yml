name: nuxtjs
services:
  db:
    image: postgres:16
    container_name: mosec-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: mosec
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mosec"]
      interval: 5s
      timeout: 5s
      retries: 10

  nuxt:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: mosec-nuxt
    ports:
      - "3000:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - DATABASE_URL=postgresql://postgres:root@db:5432/mosec
      - NUXT_HOST=0.0.0.0
      - NUXT_PORT=3000
      - CHOKIDAR_USEPOLLING=true
      # PythonServer runs on the host (python main.py), not in the compose
      # network, so reach it via the Docker host gateway instead of localhost.
      - NUXT_PYTHON_SERVER_URL=http://host.docker.internal:8000
    depends_on:
      db:
        condition: service_healthy

  # Fake IoT device: continuously POSTs door/projector readings to the app.
  # Only runs when the "dummy" profile is active — toggle it in .env with:
  #   COMPOSE_PROFILES=dummy   (on)   /   COMPOSE_PROFILES=   (off)
  dummy-iot:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: mosec-dummy-iot
    profiles: ["dummy"]
    command: ["npx", "tsx", "scripts/dummy-iot.ts"]
    environment:
      - BASE_URL=http://nuxt:3000
      - INTERVAL_MS=${DUMMY_INTERVAL_MS:-5000}
      - DOOR_INCIDENTS_PER_DAY=${DOOR_INCIDENTS_PER_DAY:-1.5}
      - DOOR_CLOSE_CHANCE=${DOOR_CLOSE_CHANCE:-0.5}
      - PROJ_INCIDENTS_PER_DAY=${PROJ_INCIDENTS_PER_DAY:-2}
      - PROJ_OFF_CHANCE=${PROJ_OFF_CHANCE:-0.3}
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      - nuxt
    restart: unless-stopped

volumes:
  pgdata:
  